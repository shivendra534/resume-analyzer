<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Analyzer</title>
    <style>
        * { box-sizing: border-box; }
        body {
          font-family: 'Segoe UI', Arial, sans-serif;
          background: #0f172a;
          color: #e2e8f0;
          margin: 0;
          padding: 40px 20px;
          display: flex;
          justify-content: center;
        }
        .container {
          max-width: 560px;
          width: 100%;
        }
        h1 {
          font-size: 24px;
          margin-bottom: 4px;
        }
        p.subtitle {
          color: #94a3b8;
          margin-top: 0;
          margin-bottom: 30px;
        }
        .card {
          background: #1e293b;
          border-radius: 12px;
          padding: 24px;
          margin-bottom: 20px;
          border: 1px solid #334155;
        }
        .card h2 {
          font-size: 16px;
          margin-top: 0;
          color: #38bdf8;
        }
        input, textarea {
          width: 100%;
          padding: 10px;
          margin-top: 6px;
          margin-bottom: 14px;
          border-radius: 6px;
          border: 1px solid #334155;
          background: #0f172a;
          color: #e2e8f0;
          font-size: 14px;
        }
        textarea { min-height: 100px; resize: vertical; }
        label { font-size: 13px; color: #cbd5e1; }
        button {
          background: #38bdf8;
          color: #0f172a;
          border: none;
          padding: 10px 18px;
          border-radius: 6px;
          font-weight: 600;
          cursor: pointer;
          font-size: 14px;
        }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .status {
          font-size: 13px;
          margin-top: 10px;
          padding: 8px 10px;
          border-radius: 6px;
        }
        .status.success { background: #064e3b; color: #6ee7b7; }
        .status.error { background: #450a0a; color: #fca5a5; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Resume Analyzer</h1>
    <p class="subtitle">Upload your resume and a job description to get an AI-powered match score and suggestions.</p>

    <!-- AUTH CARD -->
    <div class="card" id="authCard">
        <h2>1. Login or Register</h2>
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <button onclick="register()">Register</button>
        <button onclick="login()" style="margin-left:8px;">Login</button>
        <div id="authStatus"></div>
    </div>

    <!-- UPLOAD CARD -->
    <div class="card hidden" id="uploadCard">
        <h2>2. Upload Resume</h2>
        <input type="file" id="resumeFile" accept="application/pdf">
        <button onclick="uploadResume()">Upload Resume</button>
        <div id="uploadStatus"></div>
    </div>

    <!-- JOB CARD -->
    <div class="card hidden" id="jobCard">
        <h2>3. Add Job Description</h2>
        <label>Job Title</label>
        <input type="text" id="jobTitle" placeholder="e.g. Backend Developer">
        <label>Job Description</label>
        <textarea id="jobDescription" placeholder="Paste the full job description here..."></textarea>
        <button onclick="createJob()">Save Job</button>
        <div id="jobStatus"></div>
    </div>

    <!-- MATCH CARD -->
    <div class="card hidden" id="matchCard">
        <h2>4. Analyze Match</h2>
        <button onclick="runMatch()">Run AI Analysis</button>
        <div id="matchStatus"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
